spring.application.name=demo
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/odonto_clinic}
api.security.token.secret=${JWT_SECRET:fallback-local-apenas}
spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=tamanho
spring.data.web.sort.sort-parameter=ordem

# Reverse proxy (Nginx + Cloudflare SSL) — sem isso o Swagger gera URL http:// em vez de https://
server.forward-headers-strategy=native

# ============ MIGRAÇÃO PARA MULTI-TENANT ============
# Deixe true na PRIMEIRA vez que rodar depois do refactor. Isso apaga TODOS os
# dados (que ficariam órfãos sem clinicaId). Depois de rodar 1 vez com sucesso,
# volte pra false — senão o banco é apagado a cada restart.
bokka.migration.drop-all-on-startup=${BOKKA_DROP_ALL:false}

# ============ SEED DE USUÁRIOS DEV ============
# Cria automaticamente 3 logins de bootstrap:
#   - Wilson (proprietário da clínica dev "bokka-dev")
#   - Tainah (proprietária de "consultoriotainahsantos")
#   - Wilson como sócio no consultório da Tainah
# Idempotente: pula usuários/clínicas que já existem.
# Ative na primeira vez, depois volte pra false.
bokka.seed.dev-users=${BOKKA_SEED_DEV_USERS:false}
bokka.seed.wilson-password=${BOKKA_WILSON_PASSWORD:bokka123}
bokka.seed.tainah-password=${BOKKA_TAINAH_PASSWORD:tainah123}

# DESENVOLVIMENTO APENAS
# logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
# logging.level.org.mongodb.driver.protocol.command=DEBUG
# ============ E-MAIL TRANSACIONAL (Resend) ============
# Chave vazia = modo log: o e-mail é impresso no console e NÃO é enviado.
# A chave real vem só do ambiente (RESEND_API_KEY / -Dresend.api.key); nunca versionar.
resend.api.key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:Bokka <notificacoes@bokka.com.br>}
resend.reply-to=${RESEND_REPLY_TO:suporte@bokka.com.br}
# Base de todos os links enviados por e-mail (produção: https://app.bokka.com.br)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ============ CORS ============
# Origens do frontend autorizadas a chamar a API (separadas por vírgula). Definir CORS_ALLOWED_ORIGINS
# (ou -Dapp.cors.allowed-origins) SUBSTITUI a lista inteira.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.bokka.com.br,https://bokka.com.br,https://www.bokka.com.br,https://odonto-clinic-web.pages.dev,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
