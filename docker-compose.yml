services:
  mongodb:
    image: mongo:7
    container_name: bokka-mongo
    ports:
      - "27017:27017"
    volumes:
      - bokka-mongo-data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0
    container_name: bokka-mongo-ui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  bokka-mongo-data:
    external: true
